[package]
name = "ginc"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
compiler-profile = { workspace = true }
ast = { workspace = true }
interface = { workspace = true }
diagnostic = { workspace = true }
typecheck = { workspace = true }
codegen = { workspace = true }
resolve = { workspace = true }
parser = { workspace = true }
flask = { workspace = true }
clap = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
analysis = { workspace = true }
ed25519-dalek = "2"
semver = { workspace = true }
tar = "0.4"
criterion = "0.5"
test-fixtures = { workspace = true }

# [[bench]]
# name = "lexer_bench"
# harness = false

[features]
profile-allocations = ["compiler-profile/allocations"]
