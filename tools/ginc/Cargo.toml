[package]
name = "ginc"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
compiler-profile = { workspace = true }
num-traits = { workspace = true }
diagnostic = { workspace = true }
backend = { workspace = true }
parser = { workspace = true }
ast = { workspace = true }
package = { path = "../../crates/package" }
typecheck = { path = "../../crates/typecheck" }
flask = { workspace = true }
clap = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }
melior = "0.27"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
test-fixtures = { workspace = true }

# [[bench]]
# name = "lexer_bench"
# harness = false

[features]
profile-allocations = ["compiler-profile/allocations"]
