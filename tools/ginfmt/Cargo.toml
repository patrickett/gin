[package]
name = "ginfmt"
version = "0.1.0"
edition = "2024"
publish = false
description = "Formatter for Gin source on the new frontend (lexer, parser, ast)"

[lints]
workspace = true

[lib]
name = "ginfmt"
path = "src/lib.rs"

[[bin]]
name = "ginfmt"
path = "src/main.rs"

[dependencies]
diagnostic = { workspace = true }
ast = { workspace = true }
lexer = { workspace = true }
parser = { workspace = true }

[dev-dependencies]
tempfile = "3"
