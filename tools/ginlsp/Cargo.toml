[package]
name = "ginlsp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Language server for Gin on the new frontend: parser, the source checker, package and the ginterpreter session layer"

[lints]
workspace = true

[lib]
name = "ginlsp"

[[bin]]
name = "ginlsp"
path = "src/main.rs"

[dependencies]
diagnostic = { workspace = true }
flask = { workspace = true }
ginterpreter = { path = "../ginterpreter" }
ginfmt = { workspace = true }
interpreter = { path = "../../crates/interpreter" }
lsp-types = { workspace = true }
package = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ast = { workspace = true }
parser = { workspace = true }

[dev-dependencies]
tempfile = "3"
