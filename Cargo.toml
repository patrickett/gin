[workspace]
default-members = [
    "crates/flask",
    "crates/ast",
    "crates/lexer",
    "crates/parser",
    "crates/package",
    "crates/machine-model",
    "crates/interpreter",
    "crates/span",
    "crates/diagnostic",
    "crates/typecheck",
    "crates/interface-codec",
    "crates/backend",
    "editors/tree-sitter-gin",
    "tools/ginc",
    "tools/ginfmt",
    "tools/ginlsp",
    "tools/ginterpreter",
]
members = [
    "crates/compiler-profile",
    "editors/tree-sitter-gin",
    "crates/test-fixtures",
    "tools/begin",
    "crates/flask",
    "crates/ast",
    "crates/lexer",
    "crates/parser",
    "crates/package",
    "crates/machine-model",
    "crates/interpreter",
    "crates/span",
    "crates/diagnostic",
    "crates/backend",
    "tools/ginc",
    "tools/ginfmt",
    "tools/ginlsp",
    "tools/ginterpreter",
    "crates/typecheck",
    "crates/interface",
    "crates/interface-codec",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = "warn"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[workspace.dependencies]
compiler-profile = { path = "crates/compiler-profile" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.2", features = ["derive"] }
lsp-types = "0.94.1"
flask = { path = "crates/flask" }
ginc = { path = "tools/ginc" }
ast = { path = "crates/ast" }
lexer = { path = "crates/lexer" }
parser = { path = "crates/parser" }
package = { path = "crates/package" }
dashmap = "6.1.0"
span = { path = "crates/span" }
diagnostic = { path = "crates/diagnostic" }
backend = { path = "crates/backend" }
ginfmt = { path = "tools/ginfmt" }
interface = { path = "crates/interface" }
interface-codec = { path = "crates/interface-codec" }
test-fixtures = { path = "crates/test-fixtures" }
indexmap = "2"
log = "0.4"
thiserror = "2.0.11"
crossbeam-channel = "0.5.15"
dirs = "6"
rayon = "1"
sha2 = "0.10"
ignore = "0.4"
smallvec = "1.15"

strum = { version = "0.27", features = ["derive"] }
derive_more = { version = "2.1", features = ["from", "deref", "deref_mut", "display"] }
itertools = "0.14"
kinded = "0.5"
i256 = { version = "0.2", features = ["num-traits"] }
num-traits = "0.2"
target-lexicon = "0.13"
semver = "1"
criterion = "0.5"
